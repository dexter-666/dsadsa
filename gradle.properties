org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# TODO(geckolib5-port): now points at GeckoLib 5.5.5 (com.geckolib.* package, MC 26.2).
# The jar is bundled locally under common/libs and fabric/libs (see build.gradle flatDir repos)
# since GeckoLib 5's real Maven coordinates weren't reachable from the sandbox that prepared this port.
# If GeckoLib 5 is published to a Maven repo you can reach (fabricmc, modrinth maven, geckolib's own maven,
# etc.), swap the flatDir dependency for a normal modImplementation "com.geckolib:...:5.5.5" instead.
geckolib_version=5.5.5
cloth_config_version=11.1.136
modmenu_version=7.2.2
emi_version=1.1.24+1.20.1
jade_fabric_version=11.13.1+fabric
jade_forge_version=11.13.2+forge
jei_version=15.48.0.179

