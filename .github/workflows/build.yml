name: Build (MC 26.2 / GeckoLib 5 port)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GeckoLib 5.5.5 requires Java 25 for compilation, but Gradle 8.14 cannot
      # RUN on JDK 25 (Groovy ASM does not support class file major version 69).
      # Fix: install JDK 24 as the Gradle daemon JVM, and let the Java toolchain
      # (configured in build.gradle) auto-provision JDK 25 for compilation.
      - name: Set up JDK 24 (Gradle daemon)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Java + Gradle versions
        run: |
          java -version
          ./gradlew -version

      - name: Build fabric jar
        run: ./gradlew :fabric:build --stacktrace

      - name: Upload build logs (always, for debugging TODO(geckolib5-port) spots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            fabric/build/reports
            common/build/reports
          if-no-files-found: ignore

      - name: Upload fabric mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saintsdragons-fabric-mc26.2
          path: fabric/build/libs/*.jar
