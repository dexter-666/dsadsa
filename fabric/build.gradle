plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations.configureEach {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$fabric_loader_version")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'JamiesWhiteShirt'
        url = 'https://maven.jamieswhiteshirt.com/libs-release/'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven { url = "https://cursemaven.com" }
    // TODO(geckolib5-port): local fallback, see comment in root build.gradle.
    flatDir { dirs 'libs' }
}

dependencies {
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation include("com.jamieswhiteshirt:reach-entity-attributes:2.4.0")
    // TODO(geckolib5-port): resolved from the local jar (flatDir repo above) as "geckolib-fabric-26.2"
    // version "5.5.5" - matches the filename geckolib-fabric-26.2-5.5.5.jar you supplied.
    modImplementation("com.geckolib:geckolib-fabric-26.2:${geckolib_version}")
    modApi include("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    // TODO(geckolib5-port): commented out - these coordinates bake in "1.20.1"/"${minecraft_version}"
    // and almost certainly don't exist for MC 26.2 yet, which would fail dependency resolution before
    // the build even gets to compiling code. Re-enable once you've found the correct MC-26.2 versions
    // (or drop the integration) on Modrinth/CurseForge for EMI, Jade and JEI.
    // modCompileOnly "dev.emi:emi-fabric:${rootProject.emi_version}:api"
    // modCompileOnly "maven.modrinth:jade:${rootProject.jade_fabric_version}"

    // ModMenu integration - Cloth Config will automatically provide the config screen
    modImplementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    // TODO(geckolib5-port): JEI integration disabled for the same reason as EMI/Jade above.
    // modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    // modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
    // modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
}

processResources {
    exclude('META-INF/mods.toml')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'version', project.version
    inputs.property 'cloth_config_version', rootProject.cloth_config_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: rootProject.minecraft_version,
                fabric_loader_version: rootProject.fabric_loader_version,
                fabric_api_version: rootProject.fabric_api_version,
                cloth_config_version: rootProject.cloth_config_version
        )
    }

    from(project(":common").file("src/main/resources/saintsdragons.accesswidener"))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    archiveFileName.set("saintsdragons-${project.version}+fabric-${rootProject.minecraft_version}.jar")
    inputFile.set(shadowJar.archiveFile)
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def commonSources = project(":common").tasks.named("sourcesJar")
    dependsOn(commonSources)
    from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) })
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        // TODO(geckolib5-port): jade compat excluded - its compileOnly dependency is commented out
        // above (no known-good MC 26.2 "jade" version found). Re-add once fixed, and restore the
        // "jade" entrypoint removed from fabric.mod.json.
        java.exclude 'com/leon/saintsdragons/fabric/integration/jade/**'
        resources.srcDirs = [
                'src/main/resources',
                '../common/src/main/resources',
                '../common/src/generated/resources'
        ]
    }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
